version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: urbansense_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urbansense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbansense_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-urbansense_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urbansense} -d ${POSTGRES_DB:-urbansense_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - urbansense_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urbansense_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-urbansense}:${POSTGRES_PASSWORD:-urbansense_secure_password}@postgres:5432/${POSTGRES_DB:-urbansense_db}
      - SECRET_KEY=${SECRET_KEY:-urbansense_ai_secret_key_sih2026_bel_super_secure}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - urbansense_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urbansense_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - urbansense_net

networks:
  urbansense_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
